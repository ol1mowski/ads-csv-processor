name: ads-csv-processor

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: adscsv
      POSTGRES_USER: adscsv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adscsv}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adscsv -d adscsv"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    image: ads-csv-processor:local
    ports:
      - "${APP_HOST_IP:-127.0.0.1}:8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/adscsv
      DB_USER: adscsv
      DB_PASSWORD: ${POSTGRES_PASSWORD:-adscsv}
      APP_STORAGE_ROOT: /data
      JAVA_TOOL_OPTIONS: -Xmx512m
      SPRING_PROFILES_ACTIVE: demo
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      JWT_SECRET: ${JWT_SECRET:-}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    volumes:
      - jobs:/data
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080
          && printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          && grep -q '"status":"UP"' <&3
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 12
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: {}
  jobs: {}
